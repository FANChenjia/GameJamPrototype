<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fbf7ef">
<title>Folating Variation 浮想变奏</title><link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2040%2040%22%3E%3Crect%20width%3D%2240%22%20height%3D%2240%22%20rx%3D%2210%22%20fill%3D%22%23f1e6d6%22/%3E%3Ctext%20x%3D%2220%22%20y%3D%2230%22%20text-anchor%3D%22middle%22%20font-size%3D%2231%22%20fill%3D%22%23795b43%22%3E%E2%99%AB%3C/text%3E%3C/svg%3E"><link rel="stylesheet" href="style.css?v=campaign-33">
</head>
<body>
<header class="masthead"><a class="brand" href="#" id="home"><span id="brand-icon"></span><span class="brand-name"><strong>浮想变奏</strong><small>Folating Variation</small></span></a><div id="chapter-label" class="chapter">选择岛屿</div><div class="header-tools"><span class="rhythm-wallet">韵律 <strong id="rhythm-points">0</strong> ✦</span><button class="text-button hidden" id="resume-game">继续本关</button><button class="text-button hidden" id="map-open">选关</button><button type="button" id="reset-progress" class="global-reset-button reset-progress-trigger" aria-label="重置所有进度" aria-haspopup="dialog" title="重置所有进度（测试）"><span aria-hidden="true">↺</span> 重置进度</button></div></header>
<main>
<section id="map-screen" class="map-screen" aria-label="选关">
<div class="map-heading"><h1>选择岛屿</h1><span id="campaign-progress">0 / 10</span></div>
<div class="island-map"><svg class="map-route" viewBox="0 0 1200 300" preserveAspectRatio="none" aria-hidden="true"><path d="M110 150 C230 10 350 290 490 140 S740 20 850 150 S1010 270 1110 120"/></svg><div id="island-list" class="island-list"></div></div>
<div class="level-heading"><h2 id="island-name">第一岛</h2><span id="island-unlock"></span></div><div id="level-list" class="level-list"></div>
</section>
<section id="shop-screen" class="shop-screen hidden" aria-label="局外商店">
<div class="screen-heading"><div><span class="eyebrow" id="shop-level"></span><h1>局外商店</h1></div><button class="secondary-button" id="shop-back">返回选关</button></div>
<div class="shop-toolbar"><strong id="prebuy-count">预购 0 / 3</strong><div id="shop-boss" class="shop-boss"></div><button class="secondary-button" id="shop-refresh">刷新 · 2 韵律</button></div>
<div id="outside-cards" class="outside-cards"></div><div class="prebuy-tray"><span>已预购</span><div id="prebuy-list"></div></div>
<div class="shop-bottom"><span id="shop-summary"></span><button class="primary-button" id="enter-level">开始布阵 →</button></div>
</section>
<section id="battle-screen" class="game-layout hidden" aria-label="游戏">
<section id="tutorial-panel" class="tutorial-panel hidden" aria-label="新手引导" role="dialog" aria-modal="true"><span id="tutorial-arrow" class="tutorial-arrow" aria-hidden="true"></span>
<div class="tutorial-heading"><div><span id="tutorial-step"></span><strong id="tutorial-title"></strong></div><button id="tutorial-skip" class="text-button">跳过引导</button></div>
<p id="tutorial-text" role="status"></p><div class="tutorial-bottom"><div><span id="tutorial-progress" class="tutorial-progress" aria-hidden="true"></span><small id="tutorial-note"></small></div><div><button id="tutorial-focus" class="text-button">定位目标 ↓</button><button id="tutorial-next" class="primary-button hidden">继续迎战</button></div></div>
</section>
<aside class="book">
<div class="panel-heading"><h2>奏法牌</h2><span id="hand-count">0 / 8</span></div>
<div id="hand-cards" class="hand-cards"></div>
<div id="card-detail" class="card-detail"><span>拖放手牌到目标使用</span></div>
<div class="draw-heading"><h2>抽选</h2><span id="draw-status">首组免费</span></div>
<div id="draw-cards" class="draw-cards"></div>
<button class="secondary-button refresh-button" id="draw-refresh">刷新 · 6 协奏</button>
<div class="wallet"><div><span>协奏点</span><strong id="book-points">0</strong></div><span id="income-label">+1 / 秒</span></div>
</aside>
<section class="stage-column">
<div class="stage-topbar"><div><strong id="level-label"></strong><span id="wave-label"></span></div><div class="stage-stats"><span>耐久 <strong id="base-count">10</strong></span><span>击败 <strong id="kill-count">0</strong></span><strong id="timer">02:00</strong></div></div>
<div class="battle-shell"><div class="field-heading"><span id="wave-tip"></span><strong id="boss-health" class="hidden"></strong><button class="text-button" id="range-toggle" aria-pressed="false">攻击范围</button></div><div class="battle-world" id="battle-world"><canvas id="battle-canvas" aria-label="五列战场与五乘四总谱"></canvas><div id="placement-grid" class="placement-grid" aria-label="总谱布阵网格"></div></div><div class="field-bottom"><span id="field-tip"></span><span id="placed-count"></span></div></div>
<p id="wave-settlement" class="wave-settlement hidden" role="status"></p>
      <div class="instrument-bench"><h2>乐器</h2><div id="instrument-list" class="instrument-list"></div></div>
<div id="unit-status" class="unit-status hidden" aria-label="乐器简介"></div>
<div id="arrange-controls" class="arrange-controls hidden"><span>重排乐器</span><button class="secondary-button" id="arrange-cancel">取消</button><button class="primary-button" id="arrange-confirm">确认重排</button></div>
<div class="transport"><span id="phase-label">布阵</span><div><button class="secondary-button" id="sell-unit" disabled>移除</button><button class="secondary-button" id="reset-game">重试</button><button class="primary-button" id="start-game">开始战斗</button></div></div>
</section>
</section>
</main>
<svg id="tutorial-shade" class="tutorial-shade hidden" aria-hidden="true"></svg>
<div class="toast" id="toast" role="status"></div>
<dialog id="result-dialog" class="result-dialog"><span id="result-symbol">✦</span><h2 id="result-title"></h2><p id="result-reason"></p><div id="result-stats" class="result-stats"></div><button class="primary-button" id="result-primary"></button><button class="text-button" id="result-map">返回选关</button><button type="button" class="text-button reset-progress-trigger modal-reset-button">重置所有进度</button></dialog>
<dialog id="overflow-dialog" class="overflow-dialog"><div class="screen-heading"><h2>保留手牌</h2><strong id="overflow-count">8 / 8</strong></div><div id="overflow-cards" class="overflow-cards"></div><button class="primary-button" id="overflow-confirm">确认保留</button><button type="button" class="text-button reset-progress-trigger modal-reset-button">重置所有进度</button></dialog>
<dialog id="progress-reset-dialog" class="progress-reset-dialog" aria-labelledby="progress-reset-title" aria-describedby="progress-reset-description"><h2 id="progress-reset-title">重置所有进度？</h2><p id="progress-reset-description">将清空通关记录、关卡解锁、韵律点和商店预购，并结束当前对局。</p><div class="progress-reset-actions"><button type="button" id="progress-reset-cancel" class="secondary-button" autofocus>取消</button><button type="button" id="progress-reset-confirm" class="primary-button">确认重置</button></div></dialog>
<script src="icons.js?v=campaign-33"></script><script src="portraits.js?v=campaign-33"></script><script src="balance.js?v=campaign-33"></script><script src="engine.js?v=campaign-33"></script><script src="renderer.js?v=campaign-33"></script><script src="tutorial.js?v=campaign-33"></script><script src="app.js?v=campaign-33"></script>
</body></html>
